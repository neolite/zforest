<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9bb4"/>
    </marker>
    <style>
      .box { fill:#141a26; stroke:#2a3550; stroke-width:1.5; rx:10; }
      .ttl { fill:#e6edf3; font-size:15px; font-weight:700; }
      .sub { fill:#8b9bb4; font-size:11px; }
      .ln  { stroke:#3a4a6b; stroke-width:1.5; fill:none; }
      .pk  { fill:#58a6ff; }
      .pk2 { fill:#3fb950; }
      .lbl { fill:#79c0ff; font-size:11px; }
    </style>
  </defs>

  <rect width="1180" height="560" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="20" font-weight="700" font-family="ui-monospace,Menlo,monospace">zforest — server-driven reactive UI (Effector Forest × Zig)</text>
  <text x="30" y="62" fill="#8b9bb4" font-size="12" font-family="ui-monospace,Menlo,monospace">one Zig binary = reactive graph + declarative view + SSR + SSE fine-grained DOM patches · ~3 MB RSS</text>

  <!-- Browser -->
  <rect class="box" x="30" y="110" width="250" height="330"/>
  <text class="ttl" x="50" y="140">browser tabs</text>
  <rect class="box" x="50" y="160" width="210" height="52"/>
  <text class="sub" x="64" y="182" fill="#e6edf3" font-size="12">tab A · /b/meta</text>
  <text class="sub" x="64" y="200">bound counter  → тред (N)</text>
  <rect class="box" x="50" y="230" width="210" height="52"/>
  <text class="sub" x="64" y="252" fill="#e6edf3" font-size="12">tab B · /t/36</text>
  <text class="sub" x="64" y="270">comment form → POST /action</text>
  <text class="sub" x="50" y="330">client.js — 8 KB, no framework:</text>
  <text class="sub" x="50" y="348">applyOps(patch) → getElementById →</text>
  <text class="sub" x="50" y="366">textContent / setAttribute /</text>
  <text class="sub" x="50" y="384">insertBefore / innerHTML</text>
  <text class="sub" x="50" y="420" fill="#3fb950">snapshot on connect =</text>
  <text class="sub" x="50" y="438" fill="#3fb950">full authoritative resync</text>

  <!-- Server -->
  <rect class="box" x="370" y="90" width="420" height="380"/>
  <text class="ttl" x="390" y="120">zboard / zforest (Zig)</text>

  <rect class="box" x="390" y="140" width="180" height="70"/>
  <text class="sub" x="404" y="162" fill="#e6edf3" font-size="12">route sessions</text>
  <text class="sub" x="404" y="180">key = cookie token + route</text>
  <text class="sub" x="404" y="198">each: own Dom + history</text>

  <rect class="box" x="590" y="140" width="180" height="70"/>
  <text class="sub" x="604" y="162" fill="#e6edf3" font-size="12">BoardModel</text>
  <text class="sub" x="604" y="180">shared across sessions</text>
  <text class="sub" x="604" y="198">global_seq atomic → fan-out</text>

  <rect class="box" x="390" y="240" width="380" height="80"/>
  <text class="sub" x="404" y="262" fill="#e6edf3" font-size="12">view engine (forest)</text>
  <text class="sub" x="404" y="280">declarative tree → diff vs server Dom</text>
  <text class="sub" x="404" y="298">emits only changed ops: text/attr/create/</text>
  <text class="sub" x="404" y="314">remove/move/when — one batch per rev</text>

  <rect class="box" x="390" y="350" width="180" height="60"/>
  <text class="sub" x="404" y="372" fill="#e6edf3" font-size="12">SQLite</text>
  <text class="sub" x="404" y="390">board.db write-through</text>

  <rect class="box" x="590" y="350" width="180" height="60"/>
  <text class="sub" x="604" y="372" fill="#e6edf3" font-size="12">SSE /events</text>
  <text class="sub" x="604" y="390">snapshot + patch stream</text>

  <!-- Arrows + animated packets -->
  <!-- action: tab B -> sessions -->
  <path class="ln" d="M280 256 C 320 256 330 175 388 175" marker-end="url(#arr)"/>
  <text class="lbl" x="285" y="225">POST /action</text>
  <circle r="5" fill="#58a6ff"><animateMotion dur="2.2s" repeatCount="indefinite" path="M280 256 C 320 256 330 175 388 175"/></circle>

  <!-- model write -->
  <path class="ln" d="M570 175 L 588 175" marker-end="url(#arr)"/>
  <circle r="5" fill="#3fb950"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M570 175 L 588 175"/></circle>

  <!-- model -> sqlite -->
  <path class="ln" d="M680 210 C 680 280 480 300 482 348" marker-end="url(#arr)"/>
  <circle r="5" fill="#3fb950"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M680 210 C 680 280 480 300 482 348"/></circle>

  <!-- seq -> view engine -->
  <path class="ln" d="M480 210 C 480 250 520 260 560 270" marker-end="url(#arr)"/>
  <text class="lbl" x="430" y="245">global_seq moved → syncPull</text>
  <circle r="5" fill="#d29922"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M480 210 C 480 250 520 260 560 270"/></circle>

  <!-- engine -> SSE -->
  <path class="ln" d="M770 320 L 770 348" marker-end="url(#arr)"/>
  <circle r="5" fill="#d29922"><animateMotion dur="2.2s" begin="1.8s" repeatCount="indefinite" path="M770 320 L 770 348"/></circle>

  <!-- SSE -> both tabs (fan-out) -->
  <path class="ln" d="M588 380 C 480 380 400 320 282 210" marker-end="url(#arr)"/>
  <path class="ln" d="M588 380 C 400 430 300 400 282 268" marker-end="url(#arr)"/>
  <text class="lbl" x="330" y="470">patch events — every route-session re-renders its own view,</text>
  <text class="lbl" x="352" y="488">counter on /b/meta and new comment on /t/36 update independently</text>
  <circle r="5" fill="#58a6ff"><animateMotion dur="2.2s" begin="2.0s" repeatCount="indefinite" path="M588 380 C 480 380 400 320 282 210"/></circle>
  <circle r="5" fill="#58a6ff"><animateMotion dur="2.2s" begin="2.0s" repeatCount="indefinite" path="M588 380 C 400 430 300 400 282 268"/></circle>

  <!-- legend -->
  <text class="sub" x="830" y="120" fill="#e6edf3" font-size="13">why it feels like htmx + React:</text>
  <text class="sub" x="830" y="142">server owns state AND view — client only</text>
  <text class="sub" x="830" y="160">applies DOM ops. No client framework,</text>
  <text class="sub" x="830" y="178">no hydration mismatch, SSR = same tree</text>
  <text class="sub" x="830" y="196">the patches are diffed from.</text>
  <text class="sub" x="830" y="230" fill="#e6edf3" font-size="13">fine-grained, not full-page:</text>
  <text class="sub" x="830" y="252">a comment bumps global_seq → every</text>
  <text class="sub" x="830" y="270">route-session diffs ITS route's view</text>
  <text class="sub" x="830" y="288">→ only changed ops (one text op for</text>
  <text class="sub" x="830" y="306">the counter) ship over SSE.</text>
  <text class="sub" x="830" y="340" fill="#e6edf3" font-size="13">session = (cookie token, route):</text>
  <text class="sub" x="830" y="362">tabs on different routes never share</text>
  <text class="sub" x="830" y="380">a view — each gets patches for its</text>
  <text class="sub" x="830" y="398">own DOM. Shared model keeps them live.</text>
</svg>
